<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Acceso - Sistema Jurídico</title>
<style>
body{font-family:Arial,sans-serif;background:#eef3f7;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center}
.card{background:white;width:360px;padding:32px;border-radius:14px;box-shadow:0 4px 18px #0002}
h1{color:#07579b;margin-top:0}input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 15px;border:1px solid #ccd5dc;border-radius:7px}
button{width:100%;padding:13px;background:#07579b;color:white;border:0;border-radius:7px;font-weight:bold}
.error{background:#ffe8e8;color:#a40000;padding:10px;border-radius:6px;margin-bottom:12px}
</style></head>
<body><div class="card">
<h1>Control Jurídico</h1><p>DIF Hermosillo</p>
{% with messages=get_flashed_messages() %}
{% for message in messages %}<div class="error">{{ message }}</div>{% endfor %}
{% endwith %}
<form method="POST">
<label>Usuario</label><input name="usuario" required autofocus>
<label>Contraseña</label><input type="password" name="password" required>
<button type="submit">INICIAR SESIÓN</button>
</form></div></body></html>
